# Runs on every push and pull request: the checks that need no TV and no network.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: main.py only imports modules that work in Decky's Python
        run: python3 tools/check_imports.py

      - name: Tests
        run: python3 -m unittest discover -s tests -v
